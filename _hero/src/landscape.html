<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1220; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      .bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(700px 700px at 68% 50%, rgba(77,163,255,0.10), transparent 70%),
          linear-gradient(160deg, #0f1a2e 0%, #0b1220 60%, #081020 100%);
      }
      #cloud { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.5" data-fps="30" data-width="1920" data-height="1080">
      <div id="scene" class="scene clip" data-start="0" data-duration="22.5" data-track-index="0">
        <div class="bg"></div>
        <canvas id="cloud"></canvas>
      </div>
    </div>
    <script src="cloud.js"></script>
    <script src="driver.js"></script>
  </body>
</html>
