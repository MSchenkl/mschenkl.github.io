<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1220; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      .bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(1200px 800px at 72% 48%, #13213b 0%, rgba(11,18,32,0) 70%),
          linear-gradient(160deg, #0f1a2e 0%, #0b1220 60%, #081020 100%);
      }
      .grid {
        position: absolute; inset: -10%;
        background-image:
          linear-gradient(rgba(77,163,255,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(77,163,255,0.06) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(closest-side at 70% 50%, #000 0%, transparent 100%);
      }
      #cam { position: absolute; inset: 0; transform-origin: 70% 50%; }
      #halo {
        position: absolute; left: 70%; top: 50%; width: 900px; height: 900px;
        margin: -450px 0 0 -450px; border-radius: 50%;
        background: radial-gradient(circle, rgba(51,224,192,0.20) 0%, rgba(77,163,255,0.10) 35%, transparent 70%);
      }
      #net { position: absolute; inset: 0; width: 100%; height: 100%; }
      #sweepWrap { position: absolute; left: 50%; top: 10%; width: 40%; height: 80%; mix-blend-mode: screen; -webkit-mask-image: radial-gradient(closest-side, #000 40%, transparent 100%); mask-image: radial-gradient(closest-side, #000 40%, transparent 100%); }
      #sweep {
        position: absolute; top: -20%; left: 0; width: 30%; height: 140%;
        background: linear-gradient(90deg, transparent, rgba(234,241,251,0.16), transparent);
        opacity: 0;
      }
      .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 60% 50%, transparent 55%, rgba(5,9,18,0.75) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-fps="30" data-width="1920" data-height="1080">
      <div id="scene" class="scene clip" data-start="0" data-duration="10" data-track-index="0">
        <div class="bg"></div>
        <div class="grid"></div>
        <div id="cam">
          <div id="halo"></div>
          <svg id="net" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="gradStroke" gradientUnits="userSpaceOnUse" x1="900" y1="200" x2="1800" y2="900">
                <stop offset="0" stop-color="#4da3ff" />
                <stop offset="1" stop-color="#33e0c0" />
              </linearGradient>
              <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3.5" result="b" />
                <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
          </svg>
          <div id="sweepWrap"><div id="sweep" data-layout-allow-overflow></div></div>
        </div>
        <div class="vignette"></div>
      </div>
    </div>
    <script src="hero.js"></script>
  </body>
</html>
